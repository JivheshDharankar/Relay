services:
  postgres:
    image: postgres:16-alpine
    container_name: relay-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relay_db
    ports:
      - "5432:5432"
    volumes:
      - relay_pgdata:/var/lib/postgresql/data

volumes:
  relay_pgdata:

